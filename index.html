<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K03S 耳机EQ参数</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#121212;color:#eee;padding:20px}
.box{max-width:600px;margin:0 auto;background:#1e1e1e;padding:24px;border-radius:14px}
h1{text-align:center;color:#66b8ff;margin-bottom:20px;font-size:22px}
.item{padding:14px;border-bottom:1px solid #333}
.item:last-child{border-bottom:none}
.name{font-weight:bold;margin-bottom:6px;color:#fff}
.param{color:#aaa;font-size:14px}
.copy{margin-top:8px;padding:6px 12px;background:#2979d0;border:none;color:#fff;border-radius:6px}
</style>
</head>
<body>
<div class="box">
<h1>西伯利亚 K03S 进阶版 EQ</h1>
<div class="item">
<div class="name">FPS游戏（CS/和平精英）</div>
<div class="param">60:-3 | 150:-2 | 400:0 | 1k:1 | 2.8k:3 | 6k:4 | 12k:2</div>
<button class="copy" onclick="navigator.clipboard.writeText('60:-3 | 150:-2 | 400:0 | 1k:1 | 2.8k:3 | 6k:4 | 12k:2')">复制参数</button>
</div>
<div class="item">
<div class="name">音乐听歌</div>
<div class="param">60:2 | 150:2 | 400:0 | 1k:-1 | 2.8k:0 | 6k:1 | 12k:3</div>
<button class="copy" onclick="navigator.clipboard.writeText('60:2 | 150:2 | 400:0 | 1k:-1 | 2.8k:0 | 6k:1 | 12k:3')">复制参数</button>
</div>
<div class="item">
<div class="name">脚步声增强</div>
<div class="param">60:-4 | 150:-2 | 400:0 | 1k:2 | 2.8k:4 | 6k:5 | 12k:1</div>
<button class="copy" onclick="navigator.clipboard.writeText('60:-4 | 150:-2 | 400:0 | 1k:2 | 2.8k:4 | 6k:5 | 12k:1')">复制参数</button>
</div>
</div>
</body>
</html>
